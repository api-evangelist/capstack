aid: capstack
name: Capstack
description: >-
  Capstack Technologies operates a digital bank-to-bank marketplace that lets
  banks, credit unions, and other financial institutions trade whole loans and
  loan participations, access liquidity, and manage portfolio concentration
  risk. Founded in 2023 and headquartered in Miami, FL, the SaaS platform
  integrates with originating banks' core banking systems and loan-origination
  systems (LOS) to surface loans available for syndication, then lets
  participating institutions search by criteria, ask questions live, and submit
  bids. It adds loan servicing (payment processing, remittance reporting, loan
  status tracking) and real-time portfolio analytics, specializing in commercial
  real estate, multifamily residential, and farmland loans. The marketplace has
  featured over $2B in assets across 200+ registered banks and credit unions.
  Capstack is backed by Cowboy Ventures and Citi Ventures. This is a private
  enterprise platform accessed via a demo/onboarding flow; no public developer
  API, SDKs, or documentation are published at this time.
